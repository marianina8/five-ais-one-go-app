# Ep04 "5 Claude skills, tested": the Ep02 contest again, one model (DeepSeek V3.2 on
# Bedrock), one skill at a time. Everything else is the Ep02 contest: same spec, harness,
# limits, container and scorer. The arms are in ep04/arms.json.
#
# plan     makes one job per arm and run
# contest  one arm, one run: the harness with that arm's skills (unmodified, from skills/)
# score    measures every run and prints the Ep04 ranking. No secrets.
# publish  commits results-ep04/ to a new branch. Runs no contestant code.
#
# Start it from the Actions tab (Run workflow). A push to the skills-dry-run branch runs a
# cheap smoke test instead: every arm, one run, three model calls each.
name: Skills test (Ep04)

on:
  workflow_dispatch:
    inputs:
      arms:
        description: "Labels from ep04/arms.json, comma-separated, or all"
        default: all
      runs:
        description: "Runs per arm"
        type: choice
        options: ["3", "2", "1"]
        default: "3"
      max_steps:
        description: "Model calls per run"
        default: "40"
      minutes:
        description: "Time limit per run"
        default: "20"
      name:
        description: "Name for the results branch: skills-results/<name>-<run number>"
        default: skills
  push:
    branches: [skills-dry-run]

permissions:
  contents: read

concurrency:
  group: skills-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  PROVIDER: bedrock
  MODEL: deepseek.v3.2

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      max_steps: ${{ steps.plan.outputs.max_steps }}
      minutes: ${{ steps.plan.outputs.minutes }}
      branch: ${{ steps.plan.outputs.branch }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: ep04

      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          ARMS: ${{ inputs.arms }}
          RUNS: ${{ inputs.runs }}
          MAX_STEPS: ${{ inputs.max_steps }}
          MINUTES: ${{ inputs.minutes }}
          NAME: ${{ inputs.name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$EVENT" = push ]; then   # the dry run
            ARMS=all RUNS=1 MAX_STEPS=3 MINUTES=5 NAME=dry-run
          fi
          [[ "$RUNS" =~ ^[123]$ && "$MAX_STEPS" =~ ^[0-9]+$ && "$MINUTES" =~ ^[0-9]+$ && "$NAME" =~ ^[a-z0-9-]+$ ]] \
            || { echo "::error::bad inputs"; exit 1; }
          matrix=$(jq -c --arg arms "$ARMS" --argjson runs "$RUNS" '
            ($arms | split(",") | map(gsub("^ +| +$"; ""))) as $wanted
            | map(select($arms == "all" or (.label | IN($wanted[]))))
            | if length == 0 then error("no arms match: \($arms)") else . end
            | [.[] as $a | range(1; $runs + 1) | $a + {run: "run\(.)"}]
            | {include: .}' ep04/arms.json)
          {
            echo "matrix=$matrix"
            echo "max_steps=$MAX_STEPS"
            echo "minutes=$MINUTES"
            echo "branch=skills-results/$NAME-$RUN_NUMBER"
          } >> "$GITHUB_OUTPUT"
          echo "$matrix" | jq -r '"Planned \(.include | length) runs: " + ([.include[] | "\(.label)/\(.run)"] | join(", "))'

  contest:
    name: ${{ matrix.label }} ${{ matrix.run }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write   # sign in to AWS for Bedrock without stored keys
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      # The harness, the spec and the skills: the hidden tests and the reference stay out of reach.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            harness
            spec
            skills

      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"
          cache-dependency-path: harness/go.sum

      - name: Build the harness
        run: |
          (cd harness && go build -o "$RUNNER_TEMP/harness" .)
          docker pull --quiet golang:1.24

      - name: Sign in to AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.BEDROCK_ROLE_ARN }}
          aws-region: us-west-2
          role-session-name: skills-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Run ${{ matrix.label }} (${{ matrix.run }})
        env:
          LABEL: ${{ matrix.label }}/${{ matrix.run }}
          SKILLS: ${{ matrix.skills }}
          REVIEW: ${{ matrix.review }}
          MAX_STEPS: ${{ needs.plan.outputs.max_steps }}
          MINUTES: ${{ needs.plan.outputs.minutes }}
        run: |
          out="$RUNNER_TEMP/out"
          extra=()
          [ -n "$SKILLS" ] && extra+=(--skills "$SKILLS")
          [ "$REVIEW" = true ] && extra+=(--review)
          "$RUNNER_TEMP/harness" --provider "$PROVIDER" --model "$MODEL" --label "$LABEL" \
            --spec spec/SPEC.md --workspace "$out/workspace" --out "$out" \
            --max-steps "$MAX_STEPS" --minutes "$MINUTES" --sandbox docker "${extra[@]}"
          jq -r '"### \(.label)\n\nStopped by **\(.stopped_by)** after \(.model_calls) model calls and \(.tool_calls) tool calls · Skill loads: \(.tool_calls_by_name.Skill // 0) · \(.seconds)s · $\(.cost_usd)" + (if .error then "\n\nError: `\(.error)`" else "" end)' \
            "$out/stats.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the run
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: run__${{ matrix.label }}__${{ matrix.run }}
          path: ${{ runner.temp }}/out
          include-hidden-files: true
          if-no-files-found: warn

  score:
    needs: [plan, contest]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"
          cache: false

      - name: Install the linters and the scorer
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.5.0
          go -C score build -o "$RUNNER_TEMP/score" .

      - uses: actions/download-artifact@v7
        with:
          pattern: run__*
          path: ${{ runner.temp }}/runs

      - name: Measure every run
        run: |
          for dir in "$RUNNER_TEMP"/runs/run__*; do
            name=${dir##*/run__}
            label=${name%__*}
            run=${name##*__}
            target="results-ep04/$label/$run"
            mkdir -p "$target/workspace"
            cp -R "$dir"/. "$target"/
            find "$target/workspace" -type f -size +5M -print -delete
            "$RUNNER_TEMP/score" measure --project "$target/workspace" --out "$target" || echo "::warning::could not measure $label/$run"
          done
          "$RUNNER_TEMP/score" tally --results results-ep04 | tee -a "$GITHUB_STEP_SUMMARY"
          { echo; echo '```'; go -C ep04 run . -results ../results-ep04 table; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: results-ep04
          path: results-ep04
          include-hidden-files: true

  publish:
    needs: [plan, score]
    if: always() && needs.score.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the results branch; this job runs no contestant code
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: results-ep04
          path: results-ep04

      - name: Commit the results to ${{ needs.plan.outputs.branch }}
        env:
          BRANCH: ${{ needs.plan.outputs.branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add --force results-ep04
          git commit --quiet -m "Ep04 skills-test results from run ${{ github.run_id }}"
          git push origin "$BRANCH"
          echo "Results: ${{ github.server_url }}/${{ github.repository }}/tree/$BRANCH/results-ep04" >> "$GITHUB_STEP_SUMMARY"
